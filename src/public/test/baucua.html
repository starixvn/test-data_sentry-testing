<!DOCTYPE HTML>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.0.min.js"
        integrity="sha256-xNzN2a4ltkB44Mc/Jz3pT4iU1cmeR0FkXs4pru/JxaQ=" crossorigin="anonymous"></script>
    <title>Test Dice</title>
    <style>
        #result {
            width: 1150px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <h1>Random 1000 times <button onClick="window.location.href = window.location.href;">Re-random</button></h1>
    <h1>Nai: 0, Bầu: 1, Gà: 2, Cá: 3, Cua: 4, Tôm: 5</h1>

    <div id="result">Loading</div>
</body>
<script type="text/javascript">
    $(document).ready(function () {

        axios.get('/api/testBC')
            .then(function (response) {
                // handle success
                $('#result').empty().append(response.data);
            })
            .catch(function (error) {
                // handle error
                console.log(error);
            })
            .then(function () {
                // always executed
            });

    });
</script>

</html>
